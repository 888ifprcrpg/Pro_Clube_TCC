<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap');
        </style>
<link
href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' 
rel='stylesheet'> 
    <link rel="stylesheet" href="style.css">
    <title>ProClube+ Tela_Login</title>
</head>
<body>

    <!-- <img src="img/logo_padrao.png" alt="Sua Logo" class="logo"> -->

    <main class="box">

        <form id="loginForm">
             <h1>Seja bem-vindo!!</h1>
             <div class="input-box">
                <input id="usuario" placeholder="Usuário" type="text">
                <i class="bx bxs-user"></i>
             </div>

             <div class="input-box">
                <input id="senha" placeholder="Senha" type="password">
                <i class="bx bxs-lock-alt"></i>
             </div>

             <div class="check-box">
                <label>
                <input placeholder="" type="checkbox">
                Lembrar de mim
            </label>
            <a href="#"> Esqueci minha senha</a>
             </div>
             
             <button type="submit" class="login-button">Login</button>

             <div class="register-link">
                <p>Não tem uma conta? <a href="#">Cadastrar-se</a></p>
             </div>
        </form>

    </main>

    <script src="script.js"></script>

</body>
</html>
